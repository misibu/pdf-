name: Build PDF Color Checker 5.4 (portable)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Ensure 7-Zip on build runner
        shell: pwsh
        run: |
          if (!(Test-Path "$env:ProgramFiles\7-Zip\7z.exe") -and !(Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip --yes --no-progress
          }

      - name: Build standalone EXE with verified Ghostscript and FOGRA39
        shell: pwsh
        run: |
          try {
            ./build_portable.ps1
          } catch {
            Write-Host "=== BUILD FAILURE DETAILS ==="
            Write-Host "Error: $($_.Exception.Message)"
            Write-Host "Category: $($_.CategoryInfo)"
            Write-Host "At: $($_.InvocationInfo.PositionMessage)"
            Write-Host "Trace: $($_.ScriptStackTrace)"
            $_ | Format-List * -Force | Out-String | Write-Host
            throw
          }
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          if (!(Test-Path "dist/PDF_Color_Checker_5.4_Portable.exe")) {
            throw "Portable EXE missing"
          }

      - name: Verify bundled Ghostscript converts RGB PDF to CMYK
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/PDF_Color_Checker_5.4_Portable.exe').Path
          $inputPdf = (Resolve-Path 'testdata/test_rgb.pdf').Path
          $outPdf = Join-Path $env:RUNNER_TEMP 'converted.pdf'
          $p = Start-Process -FilePath $exe -ArgumentList @('--bundle-smoke-test', ('"' + $inputPdf + '"'), ('"' + $outPdf + '"')) -PassThru -Wait
          $report = "$outPdf.report.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0 -or !(Test-Path $outPdf) -or !(Test-Path $report) -or !((Get-Content $report -Raw) -match 'PASS')) {
            throw "Embedded Ghostscript smoke test failed, exit $($p.ExitCode)"
          }

      - name: Publish portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Color_Checker_5.4_Portable
          path: dist/PDF_Color_Checker_5.4_Portable.exe
          if-no-files-found: error
